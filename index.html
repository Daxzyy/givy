<body>
<main class="page">
  <article class="card stack-lg fade-in">

    <!-- header -->
    <header class="flex items-center justify-between">
      <span class="section-label">Personal Portfolio</span>
      <span class="text-xs text-zinc-400">Kebumen, ID</span>
    </header>

    <!-- profile -->
    <section class="flex flex-col items-center text-center gap-4 py-2">
      <div class="avatar-ring">
        <img src="/avatar.svg" alt="Givy" width="88" height="88"/>
      </div>
      <div class="stack" style="margin-top:0">
        <h1 class="text-2xl font-bold tracking-tight">Givy</h1>
        <p class="text-sm text-zinc-400">@givy</p>
      </div>
      <nav class="social-row" aria-label="Social links">
        <a class="social-link" href="https://tiktok.com/@givydev" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.2a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.73a8.19 8.19 0 0 0 4.76 1.52V6.84a4.84 4.84 0 0 1-1-.15z"/></svg>
          TikTok
        </a>
        <a class="social-link" href="https://youtube.com/@gipixu" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>
          YouTube
        </a>
        <a class="social-link" href="https://t.me/givyo" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.94 0C5.34 0 0 5.34 0 11.94c0 2.11.55 4.17 1.6 5.99L0 24l6.2-1.63a11.9 11.9 0 0 0 5.74 1.46h.01c6.6 0 11.94-5.34 11.94-11.94C23.89 5.34 18.55 0 11.94 0zm4.7 8.35l-1.99 9.37c-.15.66-.54.82-1.09.51l-3-2.21-1.44 1.39c-.16.16-.29.29-.6.29l.21-3.06 5.58-5.04c.24-.22-.05-.34-.37-.12l-6.9 4.34-2.98-.93c-.65-.2-.66-.65.14-.96l11.64-4.49c.54-.19 1.01.13.84.89z"/></svg>
          Telegram
        </a>
      </nav>
    </section>

    <!-- tools -->
    <section class="stack" aria-labelledby="tools-label">
      <div class="flex items-center justify-between">
        <h2 id="tools-label" class="section-label">Tools</h2>
        <span class="section-count">2</span>
      </div>
      <div class="tools-grid">
        <div class="tool-chip">
          <div class="tool-icon"><img src="/tools/claude.jpg" alt="" width="40" height="40"/></div>
          <div class="tool-meta">
            <div class="name">Claude</div>
            <div class="hint">AI assistant</div>
          </div>
        </div>
        <div class="tool-chip">
          <div class="tool-icon opencode"><img src="/tools/opencode.svg" alt="" width="40" height="40"/></div>
          <div class="tool-meta">
            <div class="name">OpenCode</div>
            <div class="hint">CLI agent</div>
          </div>
        </div>
      </div>
    </section>

    <!-- music player -->
    <section class="stack" aria-labelledby="music-label">
      <div class="flex items-center justify-between">
        <h2 id="music-label" class="section-label">Favorite Music</h2>
        <span class="section-count">MP3 · 27s</span>
      </div>

      <div class="player-cover" id="player-cover">
        <img src="/music/cover.svg" alt="Album cover"/>
      </div>

      <!-- progress -->
      <div class="stack" style="margin-top:0">
        <div class="progress-wrap" id="progress" role="slider" tabindex="0"
             aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-knob" id="progress-knob"></div>
        </div>
        <div class="time-row">
          <span id="time-current">00:00</span>
          <span id="time-duration">00:00</span>
        </div>
      </div>

      <!-- controls -->
      <div class="flex items-center justify-between gap-3 player-controls">
        <button class="icon-btn" id="btn-repeat" type="button" aria-label="Repeat" aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
        </button>
        <div class="flex items-center gap-2">
          <button class="icon-btn" type="button" aria-label="Skip back" onclick="var a=document.getElementById('audio');a.currentTime=Math.max(0,a.currentTime-5)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" x2="5" y1="19" y2="5"></line></svg>
          </button>
          <button class="btn-play" id="btn-play" type="button" aria-label="Play">
            <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
            <svg id="icon-pause" hidden xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
          </button>
          <button class="icon-btn" type="button" aria-label="Skip forward" onclick="var a=document.getElementById('audio');a.currentTime=Math.min(a.duration||0,a.currentTime+5)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" x2="19" y1="5" y2="19"></line></svg>
          </button>
        </div>
        <div class="volume-row" style="max-width:110px">
          <button class="icon-btn" id="btn-mute" type="button" aria-label="Mute">
            <svg id="icon-vol" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            <svg id="icon-mute" hidden xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" x2="16" y1="9" y2="15"></line><line x1="16" x2="22" y1="9" y2="15"></line></svg>
          </button>
          <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume"/>
        </div>
      </div>

      <audio id="audio" preload="metadata" src="/music/favorite.mp3"></audio>
    </section>

    <!-- projects -->
    <section class="stack" aria-labelledby="projects-label">
      <div class="flex items-center justify-between">
        <h2 id="projects-label" class="section-label">Projects</h2>
        <span class="section-count">3</span>
      </div>

      <a class="project-row" href="https://amfinder.web.id" target="_blank" rel="noopener noreferrer">
        <img class="thumb" src="/projects/amfinder-og.png" alt="" width="36" height="36"/>
        <div class="body">
          <div class="title">AM Preset Finder</div>
          <div class="sub">Preset discovery tool</div>
        </div>
        <span class="visit">Visit
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
        </span>
      </a>

      <div class="project-empty" aria-label="Empty project slot">
        <div class="thumb">+</div>
        <div class="body">
          <div class="title">Coming soon</div>
          <div class="sub">Reserved slot</div>
        </div>
        <span class="badge">02</span>
      </div>

      <div class="project-empty" aria-label="Empty project slot">
        <div class="thumb">+</div>
        <div class="body">
          <div class="title">Coming soon</div>
          <div class="sub">Reserved slot</div>
        </div>
        <span class="badge">03</span>
      </div>
    </section>

    <footer class="footer">© 2026 Givy</footer>
